name: CD — Deploy to Azure

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Provision & Deploy to Azure
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: azd config set auth.useAzCliAuth true

      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SQL_ADMINISTRATOR_LOGIN: ${{ secrets.SQL_ADMINISTRATOR_LOGIN }}
          SQL_ADMINISTRATOR_OBJECT_ID: ${{ secrets.SQL_ADMINISTRATOR_OBJECT_ID }}

      - name: Export azd environment variables
        run: azd env get-values >> $GITHUB_ENV

      - name: Run Ephemeral VNet Database Migration
        shell: pwsh
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ""
          POWERSHELL_TELEMETRY_OPTOUT: "1"
        run: |
          .\tools\run-vnet-migration.ps1 `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -SqlServerName $env:AZURE_SQL_SERVER_NAME `
            -DatabaseName $env:AZURE_SQL_DATABASE_NAME `
            -VnetName $env:AZURE_VNET_NAME `
            -MigrationIdentityResourceId $env:MIGRATION_IDENTITY_RESOURCE_ID `
            -ApiAppName $env:API_APP_NAME

      - name: Deploy Applications
        run: azd deploy --all --no-prompt
