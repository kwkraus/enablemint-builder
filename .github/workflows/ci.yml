name: CI

on:
  push:
    branches: [master, "copilot/**", "spec-*"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/backend/EnableFront.Builder.Api.Tests/EnableFront.Builder.Api.Tests.csproj --configuration Release --verbosity normal
        working-directory: ${{ github.workspace }}

      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef

      - name: Build Migration Bundle
        run: dotnet ef migrations bundle --project EnableFront.Builder.Api.csproj --output efbundle --self-contained -r linux-x64 --configuration Release

      - name: Upload Migration Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: efbundle-linux-x64
          path: src/backend/efbundle

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          BACKEND_API_BASE_URL: http://localhost:5000
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret-placeholder
          # Non-production placeholders: only satisfy build-time configuration validation.
          # These are not Azure credentials and must never be used outside CI.
          AZURE_AD_CLIENT_ID: 00000000-0000-4000-8000-000000000001
          AZURE_AD_CLIENT_SECRET: ci-placeholder-not-a-secret
          AZURE_AD_TENANT_ID: 00000000-0000-4000-8000-000000000002
